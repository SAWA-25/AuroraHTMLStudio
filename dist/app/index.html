<style>html,body{background:#171310;margin:0}#boot{position:fixed;inset:0;z-index:999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:#171310;color:#e6dbcf;font:13px system-ui,sans-serif}#bootErr{max-width:80vw;white-space:pre-wrap;color:#f08a80;font:12px monospace;text-align:left}#bootErr button{margin:10px 6px 0 0;padding:8px 16px;border-radius:8px;border:0;background:#d49172;color:#21170f;cursor:pointer;font:13px system-ui}</style>
<script>
(function(){var errs=[];window.__bootErrs=errs;
window.addEventListener('error',function(e){errs.push((e.message||'资源加载失败')+' @ '+(e.filename||(e.target&&(e.target.src||e.target.href))||'')+(e.lineno?':'+e.lineno:''));},true);
window.addEventListener('unhandledrejection',function(e){errs.push('Promise: '+(e.reason&&e.reason.message||e.reason));});
window.__resetLayout=async function(){
  if(window.__resetLayoutBusy)throw new Error('布局重置正在进行，请等待');
  var live=null,store=null,token=null,locked=false;
  try{if(typeof App==='object')live=App;}catch(e){}
  try{if(typeof Store==='object')store=Store;}catch(e){}
  if((live&&live.restoring)||(store&&store.paused))throw new Error('请先完成当前的数据恢复，再重置布局');
  if(window.WIN15&&WIN15.hasOtherWindows&&WIN15.hasOtherWindows())throw new Error('请先关闭其他 Aurora 窗口，再重置布局');
  window.__resetLayoutBusy=true;
  try{
    // 先完成已排队的编辑，再阻止旧内存、计时器和卸载保存撤销重置。
    if(live){live.restoring=true;locked=true;}
    if(store&&store.flush){var saved=await store.flush();if((saved&&saved.ok===false)||(store.hasUnsaved&&store.hasUnsaved()))throw new Error('仍有内容未保存，请先重试保存，再重置布局');}
    if(store&&store.beginRecovery)token=await store.beginRecovery();
    var r=await fetch('/api/kv?k=settings',{cache:'no-store',signal:AbortSignal.timeout(15000)});
    if(!r.ok)throw new Error('读取设置失败（HTTP '+r.status+'），没有重置任何内容');
    var version=r.headers&&r.headers.get('ETag');
    if(!version||!/^"(?:missing|[a-f0-9]{64})"$/i.test(version))throw new Error('服务器缺少数据版本，请重启新版 Aurora 后重试');
    var settings=await r.json();
    if(!settings||typeof settings!=='object'||Array.isArray(settings))throw new Error('无法确认原设置，未执行重置。请先备份 data 目录');
    var ui=Object.assign({},settings.ui||{});
    ['theme','editorW','editorH','sideW','hideEditor','hideSide','fontSize','wrap','device','bg','zoom','accent','density','backdrop','railLabels'].forEach(function(k){delete ui[k];});
    settings.ui=ui;
    var data=JSON.stringify(settings);
    r=await fetch('/api/kv?k=settings',{method:'POST',headers:{'Content-Type':'application/json','If-Match':version},body:data,signal:AbortSignal.timeout(15000)});
    if(r.status===412||r.status===428)throw new Error('其他窗口已修改设置，本次没有重置。请重新读取后重试');
    if(!r.ok)throw new Error('保存布局失败（HTTP '+r.status+'），请重试；尚未重新加载');
    if(live){live.settings=settings;live._confirmedRecoveryReload=true;}
    try{localStorage.setItem('aurora_settings',data);}catch(e){console.warn('布局已写入数据目录，浏览器缓存未更新',e);}
    // 成功后保持保存屏障，直到安全模式的新文档替换当前页面。
  }catch(e){
    if(token)store.endRecovery(token,'cancel');
    if(locked)live.restoring=false;
    throw e;
  }finally{window.__resetLayoutBusy=false;}
};
window.__bootFail=function(msg,waiting){var b=document.getElementById('boot');if(!b)return;if(window.AuroraSplash)window.AuroraSplash.fail(waiting===true);var d=document.getElementById('bootErr');if(!d){d=document.createElement('div');d.id='bootErr';b.appendChild(d);}
d.textContent='启动遇到问题：'+(msg||'')+(errs.length?'\n\n'+errs.slice(-8).join('\n'):'')+'\n';
var safe=function(){var u=new URL(location.href);u.searchParams.set('safe','1');location.assign(u.href);};
var r=document.createElement('button');r.textContent='重新加载';r.onclick=function(){location.reload();};
var c=document.createElement('button');c.textContent='安全模式（不加载插件）';c.onclick=safe;
var reset=document.createElement('button');reset.textContent='仅重置界面布局';reset.title='保留 API、预设、长期要求及其他设置';
reset.onclick=async function(){if(!confirm('仅重置外观、面板宽度和预览布局，保留 API、预设和长期要求。请先关闭其他 Aurora 窗口。继续？'))return;reset.disabled=true;try{await window.__resetLayout();safe();}catch(e){var err=document.createElement('div');err.textContent=e.message||String(e);d.appendChild(err);reset.disabled=false;}};
d.appendChild(r);d.appendChild(c);d.appendChild(reset);};
setTimeout(function(){if(document.getElementById('boot')&&!window.__booted)window.__bootFail('15 秒内没有完成启动。',true);},15000);})();
</script>

<body>
<div id="boot" aria-label="Aurora HTML Studio 正在启动" aria-busy="true">
  <div class="boot-meta"><span>AURORA / HTML STUDIO</span><span>项目 · 代码 · 实时预览</span></div>
  <div class="boot-composition">
    <div class="boot-workbench" aria-hidden="true">
      <div class="boot-code">
        <i class="boot-code-row" style="--row:0;--row-width:76%"></i>
        <i class="boot-code-row" style="--row:1;--row-width:92%"></i>
        <i class="boot-code-row" style="--row:2;--row-width:61%"></i>
        <i class="boot-code-row" style="--row:3;--row-width:84%"></i>
        <i class="boot-code-row" style="--row:4;--row-width:50%"></i>
        <i class="boot-code-row" style="--row:5;--row-width:70%"></i>
      </div>
      <div class="boot-preview">
        <svg class="boot-preview-mark" viewBox="0 0 48 48" focusable="false" aria-hidden="true"><path d="M17 12 8 24l9 12M31 12l9 12-9 12M27 9 21 39" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="square" stroke-linejoin="miter"/></svg>
        <i class="boot-preview-title"></i>
        <i class="boot-preview-line" style="--preview-width:84%"></i>
        <i class="boot-preview-line" style="--preview-width:58%"></i>
      </div>
    </div>
    <span class="boot-kicker">CREATE / PREVIEW / REFINE</span>
    <h1 class="boot-word" aria-label="Aurora"><span class="boot-letter" style="--i:0" aria-hidden="true">A</span><span class="boot-letter" style="--i:1" aria-hidden="true">u</span><span class="boot-letter" style="--i:2" aria-hidden="true">r</span><span class="boot-letter" style="--i:3" aria-hidden="true">o</span><span class="boot-letter" style="--i:4" aria-hidden="true">r</span><span class="boot-letter" style="--i:5" aria-hidden="true">a</span></h1>
    <span class="boot-subtitle">从代码到实时预览，继续创作。</span>
    <span class="boot-rule" aria-hidden="true"></span>
  </div>
  <div class="boot-footer"><span id="bootStatus" role="status" aria-live="polite">正在准备你的工作台</span><button id="bootSkip" type="button" title="跳过装饰动效，初始化完成后进入工作台">跳过动效 · Esc</button></div>
</div>
<div id="app">

    <div class="brand"><span class="brand-mark"></span><span class="brand-name">Aurora<b>Studio</b></span></div>
    <button id="projBtn" class="proj-btn" title="切换项目"><i id="projIcon" class="fa-solid fa-code"></i><span id="projName">项目</span><em id="projType">网页</em><i class="fa-solid fa-chevron-down caret"></i></button>
    <div class="tb-group">
      <button class="tb" id="btnNew" title="新建项目（模板库）"><i class="fa-solid fa-plus"></i><span>新建</span></button>
      <button class="tb" id="btnImport" title="导入 HTML / 正则 JSON / 主题 JSON / 项目备份"><i class="fa-solid fa-file-import"></i><span>导入</span></button>

      <button class="tb accent" id="btnCopy" title="一键复制"><i class="fa-solid fa-copy"></i><span>一键复制</span></button>
    </div>
    <div class="tb-spacer"></div>
    <div class="tb-group">
      <button class="tb" id="btnSkin" title="软件美化：选择软件文件夹，自动识别界面并换肤"><i class="fa-solid fa-paintbrush"></i><span>软件美化</span></button>

      <button class="tb icon" id="btnTheme" title="切换明暗主题"><i class="fa-solid fa-circle-half-stroke"></i></button>
    </div>
  </header>

  <main id="workspace">
    <section id="paneEditor" class="pane">
      <div class="pane-head">

          <button class="icon" id="btnWrap" title="自动换行"><i class="fa-solid fa-paragraph"></i></button>
          <button class="icon" id="btnCopyTab" title="复制当前标签内容"><i class="fa-regular fa-copy"></i></button>

        </div>
      </div>
      <div class="pane-body" id="editorBody"></div>
    </section>
    <div class="splitter" id="split1"></div>

    <section id="panePreview" class="pane">
      <div class="pane-head preview-head">
        <button class="icon ghost-show" id="btnShowEditor" title="展开编辑器"><i class="fa-solid fa-angles-right"></i></button>
        <div class="seg" id="deviceSeg">
          <button data-dev="full" title="自适应"><i class="fa-solid fa-expand"></i></button>
          <button data-dev="desktop" title="桌面 1280"><i class="fa-solid fa-desktop"></i></button>
          <button data-dev="tablet" title="平板 820"><i class="fa-solid fa-tablet-screen-button"></i></button>
          <button data-dev="mobile" title="手机 390"><i class="fa-solid fa-mobile-screen"></i></button>
        </div>

          <option value="fit">适应</option><option value="1">100%</option><option value="0.75">75%</option><option value="0.5">50%</option><option value="1.25">125%</option>

        <div class="seg" id="bgSeg" title="预览背景">
          <button data-bg="dark" title="深色背景"><i class="fa-solid fa-moon"></i></button>
          <button data-bg="light" title="浅色背景"><i class="fa-solid fa-sun"></i></button>

          <button id="btnRegion" title="圈选区域：框选一块区域截图发给 AI"><i class="fa-regular fa-object-group"></i><span>圈区域</span></button>
